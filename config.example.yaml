# drive-profile-backup configuration
# Copy this file to config.yaml and edit it for your machine.

# Root directory to back up. Leave blank to use your home directory.
backup_root: ""

# Directory names to exclude (matched anywhere in the tree)
exclude_dirs:
  - "venv"
  - ".venv"
  - "env"
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".next"
  - ".turbo"
  - ".parcel-cache"
  - ".svelte-kit"
  - ".nuxt"
  - ".vite"
  - ".angular"
  - ".serverless"
  - ".webpack"
  - ".docusaurus"
  - ".sass-cache"
  - ".jekyll-cache"
  - "dist"
  - "build"
  - "coverage"
  - "htmlcov"
  - "*.egg-info"
  - "AppData"
  - ".local"
  - ".cache"
  - "cache"
  - ".npm"
  - ".pnpm-store"
  - ".yarn"
  - ".gradle"
  - ".hypothesis"
  - ".ipynb_checkpoints"
  - ".eggs"
  - ".pyre"
  - ".pytype"
  - ".vscode"
  - ".tox"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".claude"
  - ".codex"
  - ".omp"
  - "scoop"

# File name patterns to exclude (supports wildcards)
exclude_files:
  - "NTUSER.DAT*"
  - "ntuser.*"
  - "Thumbs.db"
  - "desktop.ini"
  - "*.tmp"
  - "*.lnk"
  - "*.pyc"
  - "*.pyo"
  - "*.tsbuildinfo"
  - ".coverage"
  - ".coverage.*"
  - "*.cache"
  - ".eslintcache"
  - ".stylelintcache"
  - ".dmypy.json"
  - "coverage.xml"

# Path patterns to exclude (matched against relative path using wildcards)
exclude_path_patterns: []

# Specific files to exclude (exact relative paths, forward slashes)
exclude_specific_files: []

# Skip symlinks and NTFS junction points (prevents infinite loops)
exclude_symlinks: true

# Default max file size in MB (files larger than this are skipped)
max_file_size_mb: 500

# Per-extension size limits in MB (set to 0 to skip that file type entirely)
size_limits_by_type:
  ".iso": 0
  ".exe": 0
  ".msi": 0
  ".dll": 0
  ".ort": 0

# Extensions that are never size-limited
no_size_limit:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".gif"
  - ".bmp"
  - ".heic"
  - ".webp"
  - ".mp4"
  - ".mov"
  - ".avi"
  - ".mkv"
  - ".wmv"
  - ".mp3"
  - ".wav"
  - ".flac"
  - ".aac"
  - ".ogg"

# Google Drive settings
# Required: set profile_name on each laptop to keep backups separate under one account.
# Example: "thinkpad" on one laptop, "surface" on another.
profile_name: "laptop-a"
drive_parent_folder_name: "Profile Backups"

# Where to store local state
# In profile mode, the default manifest path is:
# ~/.drive-backup/profiles/<profile_name>/manifest.json
manifest_path: "~/.drive-backup/manifest.json"
credentials_path: "credentials.json"
token_path: "~/.drive-backup/token.json"

# Upload behavior
resumable_threshold_mb: 5
max_retries: 3
writes_per_second: 2.5
