[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-profile-backup"
version = "0.1.0"
description = "Incrementally back up your Windows user profile to Google Drive"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "mypy>=1.8",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
drive-backup = "drive_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Config/manifest validation raises ValueError for wrongly typed user data on
# purpose: callers (e.g. cli.main) report ValueError as invalid input, so
# switching to TypeError would turn bad config into an uncaught traceback.
ignore = ["TRY004"]
