# Native Linux backup — copy to config.yaml (gitignored) or select with:
#   drive-backup --config config.linux.yaml
#   DRIVE_BACKUP_CONFIG=config.linux.yaml drive-backup
# Each machine keeps its own default via $DRIVE_BACKUP_CONFIG or a local
# config.yaml, so tracked code stays identical on every laptop/PC.
#
# Profile "inspiron-3535" backs up /home/joesa (ext4, Linux Mint) into the
# same Drive folder the Windows install used, "Computer Backups/inspiron-3535".
# Relative paths line up (checked 2026-09-28: 7,827 files / 8.9 GB byte-
# identical), so the first run seeds from the Drive manifest snapshot and
# skips them by MD5. The folder also keeps ~31k Windows-only files.
# NEVER run --prune/--prune-trash on this profile: every Windows-only file
# would look stale and be trashed.

# Blank means the current user's home directory (/home/joesa here).
backup_root: ""

exclude_dirs:
  - "venv"
  - ".venv"
  - "env"
  - ".git"
  - "__pycache__"
  - "node_modules"
  - ".next" # Next.js build output (regenerated by `next build`)
  - ".turbo" # JS monorepo task cache
  - ".parcel-cache" # Parcel build cache
  - ".svelte-kit" # SvelteKit build output
  - ".nuxt" # Nuxt build output
  - ".vite" # Vite cache
  - ".angular" # Angular CLI cache
  - ".serverless" # Serverless build/deploy cache
  - ".webpack" # Webpack cache
  - ".docusaurus" # Docusaurus generated cache/build state
  - ".sass-cache" # Sass compiler cache
  - ".local" # Pruned wholesale (flatpak GBs, Trash); precious subtrees re-included below
  - "dist" # Built frontend/package output from Code repos
  - "build" # Generated build artifacts from Code repos
  - "coverage" # Test coverage output
  - "htmlcov" # HTML coverage output
  - "*.egg-info" # Python package metadata generated by builds/installs
  - ".cache" # pip, browser, tool caches — all re-downloadable
  - "cache" # Generic project cache folders
  - ".npm" # npm package cache
  - ".pnpm-store" # pnpm package store/cache
  - ".yarn" # Yarn project cache/state
  - ".gradle" # Gradle dependency/build cache
  - ".hypothesis" # Hypothesis test cache
  - ".ipynb_checkpoints" # Notebook checkpoint cache
  - ".eggs" # setuptools build cache
  - ".pyre" # Pyre type-checker cache
  - ".pytype" # Pytype cache
  - ".vscode" # VS Code extensions (~374 MB) — re-installable; settings live in .config/Code (kept)
  - "edge_selenium_profile" # Browser cache + ML models from room-reserver
  - ".azure-functions-core-tools" # Dev tool cache (~180 MB, re-downloadable)
  - ".copilot" # GitHub Copilot cache (~115 MB, re-downloadable)
  - ".docker" # Docker Desktop cache (~72 MB, re-downloadable)
  - ".tox"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".codex"
  - ".drive-backup" # Local backup state, reports, manifests, and OAuth token
  - ".ollama" # Downloadable local models and runtime state
  - ".bun" # Downloadable Bun runtime and package state
  - "omp-edge-profile" # Generated Edge browser profile and caches
  - ".azcopy" # Transfer logs, job plans, and cached access tokens
  - ".vscode-server" # Regenerable remote VS Code runtime
  - ".vscode-shared" # Regenerable VS Code shared state database
  - ".matplotlib" # Generated font cache
  - "logs" # Generated application and LLM logs
  - ".tmp" # Generated project temporary files
  - ".tmp-pytest-clean" # Generated pytest cleanup state
  - ".ssh" # Private keys — walked only to upload encrypted (see secrets note below)
  - ".azure" # Cached Azure credentials and tool state — encrypted, never plain
  - ".cisco" # Generated VPN logs
  - "snap" # Snap package revisions — re-downloaded by snapd
  - "node24" # 205M standalone Node — re-downloadable
  - ".grip" # 2.4M grip cache — re-downloadable
  - ".npm-global" # 444K npm global prefix — re-downloadable
  - "restore" # Restored Windows/WSL archives — already on Drive; pruned so its 18k files aren't walked
  # Chromium/Electron caches (Termius, Slack, Bitwarden). Names are case-sensitive,
  # so "cache" above does not catch these.
  - "Cache"
  - "Code Cache"
  - "GPUCache"
  - "DawnGraphiteCache"
  - "DawnWebGPUCache"
  - "Service Worker"

# File name patterns to exclude (supports wildcards).
# Secret patterns (.env, *.pem, *.key, credentials.json, ...) are ENCRYPTED
# and uploaded as *.enc when encrypt_secrets is true — not skipped.
exclude_files:
  - "*.tmp"
  - "*.pyc"
  - "*.pyo"
  - "*.tsbuildinfo" # TypeScript incremental build cache
  - ".coverage" # Coverage.py data file
  - ".coverage.*" # Coverage.py parallel data files
  - "*.cache" # Generic cache files
  - ".eslintcache" # ESLint cache
  - ".stylelintcache" # Stylelint cache
  - ".dmypy.json" # mypy daemon cache metadata
  - "coverage.xml" # Coverage report output
  - ".env" # Local environment secrets (encrypted, not skipped)
  - ".env.local"
  - ".env.*.local"
  - "credentials.json"
  - "token.json"
  - "id_rsa"
  - "id_rsa.pub"
  - "id_ed25519"
  - "id_ed25519.pub"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "*.pfx"
  - ".boto" # Cloud credentials and client configuration
  - ".claude.json*" # Generated Claude account and project state
  - ".lesshst" # Interactive command history
  - ".node_repl_history" # Interactive command history
  - "*(MERGED, BAD).*" # Known-bad generated lecture copies across formats
  - "TEST *.m4a" # Generated lecture test encodes
  - "*TRIM TEST*.m4a" # Generated lecture trim-test copies
  - "*__preprocessed.wav" # open-law-notes intermediates, rebuilt from the kept source recordings
  # Credentials the scanner does not encrypt — skipped so they never reach Drive in plaintext.
  - ".credentials.json" # Claude Code OAuth tokens
  - ".npmrc" # npm auth token
  - ".Xauthority" # X session cookie
  - "Cookies" # Chromium/Electron session cookies
  - "Cookies-journal"
  - "Trust Tokens"
  - "Trust Tokens-journal"
  - "cookies.sqlite*" # Firefox session cookies
  - "key4.db" # NSS key store; with logins.json it unlocks saved passwords
  - "logins*" # Firefox saved passwords (logins.json, logins.db, logins-backup.json)
  - "*.keyring" # GNOME keyring files
  # Noise. These are file-name rules because include_path_patterns (.local/bin/**)
  # override path exclusions but not file-name exclusions.
  - "chezmoi" # 39M binary in .local/bin — re-downloadable
  - "mdv" # 39M binary in .local/bin — re-downloadable
  - ".tmux.conf.bak-*" # Timestamped config/script backups
  - "tmux-*.bak-*"
  - "registrymodifications.xcu.bak-*"
  - ".bashrc.backup.*"
  - ".bashrc.pre-*"
  - ".xsession-errors*"

# Path patterns to exclude (matched against relative path using wildcards)
exclude_path_patterns:
  - "Pictures/comfy/*" # comfy-pull gocryptfs vault, unlocked view: private ComfyUI outputs, never uploaded
  - ".comfy-vault/*" # comfy-pull gocryptfs vault ciphertext: private, never uploaded
  - ".local/lib/**" # pip user site-packages — re-downloadable
  - ".local/share/**" # app data (flatpak, Steam, Trash, caches) — exceptions re-included below
  - ".local/go/*" # Go toolchain — re-downloadable
  - ".local/opt/*" # Locally built tools (llama.cpp) — rebuildable
  - "*/harness-info/*.html" # Generated OMP reports and overviews
  - ".omp/*" # Keep OMP runtime state excluded except included session JSONL
  - ".var/app/*/cache/*" # Flatpak per-app caches
  - ".config/google-chrome-for-testing/*" # 42M browser cache — re-downloadable
  - ".config/discord/*" # 666M Electron cache — re-downloadable
  - ".mozilla/firefox/*/storage/*" # 384M site storage; bookmarks/history (places.sqlite) kept
  - "restore/*" # 11G restored Windows/WSL archives — already on Drive
  - "opt/*" # REAPER/DecentSampler installs — re-downloadable
  - "go/*" # Go module cache and built binaries (go install)
  - ".atuin/bin/*" # atuin binary — re-downloadable
  - ".config/gh/*" # GitHub CLI token (hosts.yml)
  - ".config/gcloud/*" # gcloud credentials and access tokens
  - ".var/app/*/data/pki/*" # Flatpak NSS key stores
  - ".mozilla/firefox/*/datareporting/*" # Telemetry
  - ".mozilla/firefox/*/security_state/*" # Downloaded revocation data
  - ".mozilla/firefox/*/suggest.sqlite*" # Downloaded suggestion index
  - ".mozilla/firefox/*/domain_to_categories.sqlite*" # Downloaded category data

# Explicitly preserved paths inside otherwise-excluded trees (.omp, .local).
include_path_patterns:
  - ".omp/agent/sessions/*.jsonl"
  - ".omp/agent/sessions/**/*.jsonl"
  - ".omp/*.md"                  # top-level .omp docs (HISTORY-*.md)
  - ".omp/*.py"                  # top-level .omp scripts (rename-agent-*.py)
  - ".omp/*.txt"                 # top-level .omp text (HISTORY-MIGRATED-TO-WSL.txt)
  - ".omp/agent/config.yml"      # harness config
  - ".omp/scripts/**"            # requested: future/top-level scripts
  # Repo harness substantive state — all Code/**/.omp now walked ( .omp removed from exclude_dirs );
  # top-level .omp/* still excludes binaries, but Code/**/.omp/** is included by default (no extra pattern needed).
  # Explicitly listing one repo for documentation; other Code repos covered automatically.
  - "Code/drive-profile-backup/.omp/**"
  - ".local/bin/**" # User scripts — re-included through the pruned .local tree
  - ".local/share/applications/**" # Custom .desktop entries
  - ".local/share/atuin/*.db*" # Shell history databases
  - ".local/share/fish/fish_history" # Fish shell history
  # Dotfiles source. Not "chezmoi/**": that would also walk its .git.
  - ".local/share/chezmoi/[!.]*"
  - ".local/share/chezmoi/.chezmoi*"

# Specific files to exclude (exact relative paths, forward slashes).
# The Windows-era list was dropped 2026-09-28: none of those files exist here.
exclude_specific_files: []

# Skip symlinks and NTFS junction points (prevents infinite loops)
exclude_symlinks: true

# Default max file size in MB (files larger than this are skipped)
max_file_size_mb: 150

# Per-extension size limits in MB (overrides max_file_size_mb)
# Set to 0 to skip that file type entirely
size_limits_by_type:
  ".iso": 0 # Disk images — skip entirely
  ".exe": 0 # Executables — easily re-downloaded
  ".msi": 0 # Installers — easily re-downloaded
  ".dll": 0 # Shared libraries — bundled with apps, re-downloadable
  ".ort": 0 # ONNX Runtime models — large ML artifacts, re-downloadable
  ".appimage": 0 # Portable Linux apps — re-downloadable

# Extensions that are NEVER size-limited (personal media to preserve)
no_size_limit:
  - ".jpg"
  - ".jpeg"
  - ".png"
  - ".gif"
  - ".bmp"
  - ".heic"
  - ".webp"
  - ".mp4"
  - ".mov"
  - ".avi"
  - ".mkv"
  - ".wmv"
  - ".mp3"
  - ".wav"
  - ".flac"
  - ".aac"
  - ".ogg"

# Generated machine-state inventories refreshed before each backup.
# Windows-only collectors (system, windows_apps, windows_features, services,
# scheduled_tasks, drivers, environment, network, wsl) fail without
# powershell.exe, so only portable collectors are enabled here. git_repos
# powers `drive-backup --restore --with-github-clone` (.git itself is excluded).
machine_state_collectors:
  - "package_managers"
  - "developer_tools"
  - "git_repos"

# Google Drive settings (folder names follow the device names in computer-info).
profile_name: "inspiron-3535"
drive_parent_folder_name: "Computer Backups"

# Where to store local state. No manifest_path is set on purpose: it
# auto-derives to ~/.drive-backup/profiles/inspiron-3535/manifest.json.
# The secrets key at ~/.drive-backup/secrets.key is reused from Windows —
# without it, old *.enc archives cannot be decrypted.
credentials_path: "credentials.json"
token_path: "~/.drive-backup/token.json"

# Upload behavior
resumable_threshold_mb: 5
upload_workers: 16
max_retries: 8
writes_per_second: 0
